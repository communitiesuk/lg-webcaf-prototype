{# S27 — setup / system-owner — Figma node 393:646 #}
{% extends "layouts/setup.html" %}
{% from "components/page-header.njk" import appPageHeader %}

{% block content %}
  <a class="govuk-back-link" href="{{ backHref }}">Back</a>

  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      {{ appPageHeader({
        caption: system.name + " · " + counter,
        title: "Who owns this critical system?"
      }) }}

      <form method="post" action="/setup/critical-systems/{{ system.id }}/owner" novalidate>
        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--s" for="ownerName">Name</label>
          <input class="govuk-input" id="ownerName" name="ownerName" type="text" value="{{ system.owner.name }}">
        </div>

        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--s" for="ownerJobTitle">Job title</label>
          <input class="govuk-input" id="ownerJobTitle" name="ownerJobTitle" type="text" value="{{ system.owner.jobTitle }}">
        </div>

        <button class="govuk-button" data-module="govuk-button" type="submit">Save and continue</button>
      </form>
    </div>
  </div>
{% endblock %}
