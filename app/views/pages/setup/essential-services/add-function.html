{# S10b — setup / add-a-function — Figma node 393:1080 #}
{% extends "layouts/setup.html" %}
{% from "components/page-header.njk" import appPageHeader %}

{% block content %}
  <a class="govuk-back-link" href="{{ backHref }}">Back</a>

  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      {{ appPageHeader({
        caption: service.name,
        title: "Add a function"
      }) }}

      <form method="post" action="/setup/essential-services/{{ service.id }}/functions/add" novalidate>
        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--s" for="newFunctionName">Name of the function</label>
          <div id="newFunctionName-hint" class="govuk-hint">For example: benefits management</div>
          <input class="govuk-input" id="newFunctionName" name="newFunctionName" type="text" value="" aria-describedby="newFunctionName-hint">
        </div>

        <button class="govuk-button" data-module="govuk-button" type="submit">Add this function</button>
      </form>
    </div>
  </div>
{% endblock %}
