{% extends "layouts/main.html" %}

{% block content %}
  <a class="govuk-back-link" href="/stages/2/scope/systems/review">Back</a>

  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">

  <h1 class="govuk-heading-l">Remove critical system</h1>
  <p class="govuk-body">Are you sure you want to remove <strong>{{ system.name }}</strong> from the critical systems list?</p>
  <p class="govuk-body">This will also remove any mapped services and priority details for this system.</p>

  <div class="govuk-button-group">
    <form method="post" action="/stages/2/scope/systems/{{ system.id }}/remove/confirm" class="govuk-button-group__item">
      <button class="govuk-button govuk-button--warning govuk-!-margin-bottom-0" data-module="govuk-button" type="submit">
        Remove system
      </button>
    </form>
    <a class="govuk-link" href="/stages/2/scope/systems/review">Cancel</a>
  </div>
    </div>
  </div>
{% endblock %}
